[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "csl2-legitimacy"
version = "1.0.0"
description = "Legitimacy-gated social learning: fairness, motivated cognition, and behavioural equilibrium (Cognitive Social Learning, Paper II)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Swann" }]
keywords = ["social-learning", "fairness", "legitimacy", "quantal-response",
            "M-equilibrium", "agent-based-model", "behavioural-game-theory"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/<owner>/CSL2"

[tool.setuptools]
packages = ["legitimacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
